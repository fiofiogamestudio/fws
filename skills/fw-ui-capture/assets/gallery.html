<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI 截图审阅</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243347;background:#f3f5f8;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,input,select,textarea{border:1px solid #a8b4c3;border-radius:7px;padding:.55rem .75rem;background:white;color:inherit}button:hover:not(:disabled){background:#eaf0fa}a{color:#245a99}header,main{max-width:1600px;margin:auto;padding:1.3rem}header{padding-bottom:.5rem}h1{margin:0 0 .45rem;font-size:1.7rem}p{margin:.45rem 0;line-height:1.5}.muted{color:#637187}.toolbar{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:1rem 0}.toolbar input[type=search]{flex:1;min-width:190px}.toolbar label{display:flex;gap:.4rem;align-items:center}.toolbar input[type=checkbox]{width:18px;height:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:1.1rem}.card{border:1px solid #ccd5e0;border-radius:12px;background:white;overflow:hidden;min-width:0}.preview{display:block;border:0;border-radius:0;background:#e2e8ef;padding:14px;width:100%;height:350px}.preview img{width:100%;height:100%;object-fit:contain}.content{padding:1rem}.content h2{font-size:1.05rem;margin:0 0 .4rem;overflow-wrap:anywhere}.meta{font-size:.85rem;color:#637187}.notes{margin:.65rem 0;white-space:pre-wrap;overflow-wrap:anywhere}.content textarea{width:100%;min-height:76px;resize:vertical;display:block;margin-top:.45rem}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.55rem}.badge{display:inline-block;padding:.1rem .4rem;border-radius:4px;background:#fff0cf;color:#735221;margin-left:.4rem;font-size:.8rem}.notice{padding:.65rem .85rem;border-radius:7px;background:#fff2d5;white-space:pre-wrap;overflow-wrap:anywhere}.notice:empty{display:none}.coverage{border:1px solid #ccd5e0;background:#fff;border-radius:9px;padding:.7rem 1rem;margin-bottom:1rem}.coverage summary{cursor:pointer;font-weight:600}.coverage ul{padding-left:1.2rem}.coverage li{margin:.5rem 0;overflow-wrap:anywhere}.coverage a{margin-left:.5rem}.empty{padding:3rem;text-align:center}.dialog{position:fixed;inset:0;z-index:10;background:#102032e8;display:flex;align-items:center;justify-content:center;padding:1rem}.dialog[hidden]{display:none}.viewer{width:min(1400px,100%);height:min(1100px,100%);display:flex;flex-direction:column;background:#f3f5f8;border-radius:12px;overflow:hidden}.viewerbar{display:flex;align-items:center;gap:.6rem;padding:.8rem;flex-shrink:0}.viewerbar h2{font-size:1rem;margin:0;flex:1;overflow-wrap:anywhere}.viewerimage{flex:1;min-height:0;display:flex;justify-content:center;padding:.5rem;background:#dde4ed}.viewerimage img{width:100%;height:100%;object-fit:contain;min-height:0}.viewerfooter{padding:.8rem;flex-shrink:0}.viewerfooter textarea{width:100%;height:60px;resize:vertical}.viewerfooter .meta{margin-bottom:.4rem}.fallback{max-width:800px;margin:1rem auto;border:1px solid #adb9c8;border-radius:8px;padding:1rem;background:#fff}.fallback[hidden]{display:none}.fallback textarea{width:100%;min-height:180px;white-space:pre}.fallback h2{font-size:1rem;margin-top:0}@media(max-width:580px){header,main{padding:.8rem}.viewerbar{flex-wrap:wrap}.viewerbar h2{flex-basis:calc(100% - 70px)}.preview{height:320px}.dialog{padding:.35rem}.viewerfooter{padding:.5rem}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><p id="run" class="muted"></p><p id="summary"></p>
  <details class="coverage"><summary>覆盖清单与采集证据</summary><p id="evidence"></p><p class="muted">证据说明由采集者提供；图库工具仅校验文件、尺寸、哈希及声明的覆盖关系。</p><ul id="coverage"></ul></details>
  <div class="toolbar"><input id="search" type="search" placeholder="搜索编号、界面、状态或备注" aria-label="搜索截图"><select id="category" aria-label="分类"><option value="">全部分类</option></select><label><input id="history" type="checkbox">显示历史截图</label><button id="export" type="button">导出备注 JSON</button></div>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
</header>
<main><p id="visible" class="muted"></p><div id="grid" class="grid"></div><p id="empty" class="empty" hidden></p></main>
<section id="fallback" class="fallback" hidden aria-label="手动复制"><h2 id="fallbackTitle"></h2><textarea id="fallbackText" readonly aria-label="可手动复制的内容"></textarea><div class="actions"><button id="fallbackClose" type="button">关闭</button></div></section>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
  <div class="viewer"><div class="viewerbar"><h2 id="viewerTitle"></h2><button id="close" type="button" aria-label="关闭放大图">关闭</button><button id="prev" type="button" aria-label="上一张">←</button><button id="next" type="button" aria-label="下一张">→</button><a id="original" target="_blank" rel="noopener">原图</a></div><div class="viewerimage"><img id="viewerImage" alt=""></div><div class="viewerfooter"><p id="viewerMeta" class="meta"></p><label>问题备注<textarea id="viewerNote" placeholder="指出问题或想修改的地方"></textarea></label><div class="actions"><button id="viewerCopy" type="button">复制编号与问题</button><span id="viewerStatus" class="meta" role="status"></span></div></div></div>
</div>
<script id="capture-data" type="application/json">__CAPTURE_DATA_JSON__</script>
<script id="coverage-data" type="application/json">__COVERAGE_DATA_JSON__</script>
<script>
'use strict';
const capture=JSON.parse(document.getElementById('capture-data').textContent), coverage=JSON.parse(document.getElementById('coverage-data').textContent);
const $=id=>document.getElementById(id), shots=[...capture.screenshots].sort((a,b)=>a.number-b.number), notes=new Map(), labels={captured:'已截图',blocked:'受阻',excluded:'已排除'};
let filtered=[],active=null,previousFocus=null,storageOK=true;
const number=shot=>'#'+String(shot.number).padStart(3,'0'), key=shot=>'fw-ui-capture:'+JSON.stringify([capture.project,capture.run.id,shot.id]);
const el=(tag,text,className)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;};
function message(value){$('notice').textContent=value;}
function metadata(shot){return [shot.category,shot.width+' × '+shot.height,shot.state?JSON.stringify(shot.state):'',shot.historical?'历史截图':'审阅截图'].filter(Boolean).join(' · ');}
for(const shot of shots){let note='';try{note=localStorage.getItem(key(shot))||'';}catch{storageOK=false;}notes.set(shot.id,note);}
if(!storageOK)message('浏览器无法保存本地备注。本页内仍可编辑，请在关闭前导出备注 JSON。');
function saveNote(shot,value){notes.set(shot.id,value);try{localStorage.setItem(key(shot),value);}catch{storageOK=false;message('本地存储不可用或已满。请导出备注 JSON 保存当前修改。');}for(const box of document.querySelectorAll('textarea[data-shot]'))if(box.dataset.shot===shot.id&&box.value!==value)box.value=value;}
function manual(title,value){$('fallbackTitle').textContent=title;$('fallbackText').value=value;$('fallback').hidden=false;$('fallbackText').focus();$('fallbackText').select();$('fallback').scrollIntoView({block:'center'});}
async function copy(shot){const value=number(shot)+' '+shot.title+'\n'+(notes.get(shot.id)||'（未填写问题）');try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(value);message('已复制 '+number(shot)+' 的编号与问题。');$('viewerStatus').textContent='已复制';}catch{if(active!==null)closeViewer(false);manual('剪贴板不可用，请手动复制',value);}}
function render(){const query=$('search').value.trim().toLocaleLowerCase(),category=$('category').value,history=$('history').checked;filtered=shots.filter(shot=>(history||!shot.historical)&&(!category||shot.category===category)&&(!query||[number(shot),shot.id,shot.title,shot.category,shot.state?JSON.stringify(shot.state):'',shot.notes,notes.get(shot.id)].filter(Boolean).join(' ').toLocaleLowerCase().includes(query)));$('grid').replaceChildren();for(const shot of filtered){const card=el('article',undefined,'card');card.id='shot-'+shot.number;const preview=el('button',undefined,'preview');preview.type='button';preview.setAttribute('aria-label','放大 '+number(shot)+' '+shot.title);const img=el('img');img.src=shot.path;img.alt=shot.title;img.loading='lazy';preview.append(img);preview.addEventListener('click',()=>openViewer(shot));const body=el('div',undefined,'content'),heading=el('h2');const link=el('a',number(shot)+' '+shot.title);link.href='#'+String(shot.number).padStart(3,'0');link.addEventListener('click',event=>{event.preventDefault();openViewer(shot);});heading.append(link);if(shot.historical)heading.append(el('span','历史','badge'));body.append(heading,el('p',metadata(shot),'meta'));if(shot.notes)body.append(el('p',shot.notes,'notes'));const label=el('label','问题备注'),box=el('textarea');box.dataset.shot=shot.id;box.value=notes.get(shot.id);box.placeholder='指出问题或想修改的地方';box.addEventListener('input',()=>saveNote(shot,box.value));label.append(box);const actions=el('div',undefined,'actions'),button=el('button','复制编号与问题');button.type='button';button.addEventListener('click',()=>copy(shot));actions.append(button);body.append(label,actions);card.append(preview,body);$('grid').append(card);}$('visible').textContent='显示 '+filtered.length+' / '+shots.length+' 张截图';$('empty').hidden=filtered.length>0;$('empty').textContent=shots.length===0?'尚未取得截图，请查看覆盖清单中的受阻或排除原因。':!history&&shots.some(shot=>shot.historical)?'没有符合筛选条件的审阅截图。如需查看已被替换或退役的截图，请勾选“显示历史截图”。':'没有符合筛选条件的截图。';}
function openViewer(shot,{setHash=true}={}){if(active===null)previousFocus=document.activeElement;active=shot.id;$('dialog').hidden=false;document.body.style.overflow='hidden';$('viewerTitle').textContent=number(shot)+' '+shot.title;$('viewerImage').src=shot.path;$('viewerImage').alt=shot.title;$('original').href=shot.path;$('viewerMeta').textContent=metadata(shot);$('viewerNote').value=notes.get(shot.id);$('viewerStatus').textContent='';const index=filtered.findIndex(item=>item.id===shot.id);$('prev').disabled=index<=0;$('next').disabled=index<0||index>=filtered.length-1;if(setHash){try{history.replaceState(null,'','#'+String(shot.number).padStart(3,'0'));}catch{location.hash=String(shot.number).padStart(3,'0');}}$('close').focus();}
function closeViewer(clearHash=true){active=null;$('dialog').hidden=true;document.body.style.overflow='';if(clearHash){try{history.replaceState(null,'',location.pathname+location.search);}catch{location.hash='';}}if(previousFocus?.isConnected)previousFocus.focus();}
function move(delta){const index=filtered.findIndex(shot=>shot.id===active),shot=filtered[index+delta];if(index>=0&&shot)openViewer(shot);}
function followHash(){const match=/^#(\d+)$/.exec(location.hash);if(!match){if(active!==null)closeViewer(false);return;}const shot=shots.find(item=>item.number===Number(match[1]));if(!shot){message('未找到编号 '+location.hash+' 的截图。');return;}if(shot.historical)$('history').checked=true;$('search').value='';$('category').value='';render();openViewer(shot,{setHash:false});}
$('title').textContent=capture.title;document.title=capture.title;$('run').textContent=capture.project+' · '+capture.run.id+' · '+capture.run.capturedAt;$('evidence').textContent='采集证据：'+capture.run.evidence;const s=coverage.summary;$('summary').textContent='覆盖 '+s.captured+' / '+s.total+' 项（'+s.percentCaptured+'%） · 受阻 '+s.blocked+' · 排除 '+s.excluded+' · 采用 '+s.currentScreenshots+' 张 / 历史 '+s.historicalScreenshots+' 张';
for(const item of coverage.items){const row=el('li',labels[item.status]+' · '+item.title+(item.reason?' — '+item.reason:''));for(const id of item.screenshotIds){const shot=shots.find(shot=>shot.id===id),link=el('a',number(shot));link.href='#'+String(shot.number).padStart(3,'0');row.append(link);}$('coverage').append(row);}
for(const category of [...new Set(shots.map(shot=>shot.category))].sort()){const option=el('option',category);option.value=category;$('category').append(option);}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('history').addEventListener('change',render);$('close').addEventListener('click',()=>closeViewer());$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('viewerNote').addEventListener('input',()=>{const shot=shots.find(item=>item.id===active);if(shot)saveNote(shot,$('viewerNote').value);});$('viewerCopy').addEventListener('click',()=>{const shot=shots.find(item=>item.id===active);if(shot)copy(shot);});$('fallbackClose').addEventListener('click',()=>{$('fallback').hidden=true;});$('dialog').addEventListener('click',event=>{if(event.target===$('dialog'))closeViewer();});
document.addEventListener('keydown',event=>{if(active===null)return;const editing=event.target.closest('textarea,input,select,[contenteditable="true"]');if(editing)return;if(event.key==='Escape'){event.preventDefault();closeViewer();}else if(event.key==='ArrowLeft'){event.preventDefault();move(-1);}else if(event.key==='ArrowRight'){event.preventDefault();move(1);}else if(event.key==='Tab'){const focusable=[...$('dialog').querySelectorAll('button:not(:disabled),a[href],textarea')];const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
$('export').addEventListener('click',()=>{const payload={schemaVersion:1,project:capture.project,runId:capture.run.id,exportedAt:new Date().toISOString(),notes:shots.filter(shot=>notes.get(shot.id).trim()).map(shot=>({id:shot.id,number:shot.number,title:shot.title,historical:!!shot.historical,note:notes.get(shot.id)}))},value=JSON.stringify(payload,null,2);try{const url=URL.createObjectURL(new Blob([value],{type:'application/json'})),a=el('a');a.href=url;a.download='ui-notes-'+capture.run.id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch{manual('无法下载，请复制并保存为 JSON',value);}});
window.addEventListener('hashchange',followHash);render();followHash();
</script>
</body>
</html>
